<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/Css/Login.css">
  <script src="/Js/Toast.js"></script>
  <title>Login</title>
</head>

<body>

  <main class="page">

    <!-- LEFT SIDE -->
    <section class="left-panel">

      <!-- Logo / Branding -->
      <a href="/" class="brand" style="text-decoration: none;">
        <div class="brand-logo">
          <img src="/Image/logo-icon.png" alt="LoanPro logo">
        </div>
        <div class="brand-text">
          <div class="brand-name">UBAPS</div>
          <div class="brand-tagline">Unilia Bursary Award Processing</div>
        </div>
      </a>

      <!-- Register Form Card -->
      <div class="form-card">
        <h1 class="form-title">Login</h1>

        <form id="loginForm">

          <div class="form-grid">

            <div class="form-group">
              <label for="email">Email</label>
              <input name="email" id="email" type="email" class="auth-input" placeholder="Email">
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input name="password" id="password" type="password" class="auth-input" placeholder="Password">
            </div>

          </div>

          <div class="form-actions">
            <button type="submit" class="register-btn">Login</button>
          </div>

          <div class="form-links">
            <a href="/forgot-password" class="forgot-password">Forgot Password?</a>
          </div>

          <div class="form-footer">
            <p>Don't have an account? <a href="/register-account" class="auth-link">Register here</a></p>
          </div>

        </form>
      </div>
    </section>

    <!-- RIGHT SIDE -->
    <section class="right-panel">
      <img id="ping" src="/Image/stock.jpg" alt="">
    </section>

  </main>
  <script src="/Js/Login.js"></script>
</body>

</html>
