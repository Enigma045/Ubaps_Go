<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/Css/Login.css">
  <script src="/Js/Toast.js"></script>
  <title>Reset Password - UBAPS</title>
</head>

<body>

  <main class="page">

    <!-- LEFT SIDE -->
    <section class="left-panel">

      <!-- Logo / Branding -->
      <div class="brand">
        <div class="brand-logo">
          <img src="/Image/logo-icon.png" alt="UBAPS logo">
        </div>
        <div class="brand-text">
          <div class="brand-name">UBAPS</div>
          <div class="brand-tagline">Unilia Bursary Award Processing</div>
        </div>
      </div>

      <!-- Form Card -->
      <div class="form-card">
        <h1 class="form-title">Set New Password</h1>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: var(--spacing-lg); font-size: 0.875rem;">
          Please enter your new password below.
        </p>

        <form id="resetPasswordForm">
          <input type="hidden" id="token" name="token">
          
          <div class="form-grid">
            <div class="form-group">
              <label for="password">New Password</label>
              <input name="password" id="password" type="password" class="auth-input" placeholder="Enter new password" required minlength="8">
            </div>

            <div class="form-group">
              <label for="confirmPassword">Confirm Password</label>
              <input name="confirmPassword" id="confirmPassword" type="password" class="auth-input" placeholder="Confirm new password" required minlength="8">
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="register-btn" style="width: 100%;">Update Password</button>
          </div>

          <div class="form-footer" id="status-footer" style="display: none;">
            <p><a href="/Login" class="auth-link">Back to Login</a></p>
          </div>
        </form>
      </div>
    </section>

    <!-- RIGHT SIDE -->
    <section class="right-panel">
      <img id="ping" src="/Image/stock.jpg" alt="">
    </section>

  </main>
  <script src="/Js/ResetPassword.js"></script>
</body>

</html>
