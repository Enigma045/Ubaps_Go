<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/Css/Login.css">
  <script src="/Js/Toast.js"></script>
  <title>Forgot Password - UBAPS</title>
</head>

<body>

  <main class="page">

    <!-- LEFT SIDE -->
    <section class="left-panel">

      <!-- Logo / Branding -->
      <div class="brand">
        <div class="brand-logo">
          <img src="/Image/logo-icon.png" alt="UBAPS logo">
        </div>
        <div class="brand-text">
          <div class="brand-name">UBAPS</div>
          <div class="brand-tagline">Unilia Bursary Award Processing</div>
        </div>
      </div>

      <!-- Form Card -->
      <div class="form-card">
        <h1 class="form-title">Reset Password</h1>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: var(--spacing-lg); font-size: 0.875rem;">
          Enter your email address and we'll send you a link to reset your password.
        </p>

        <form id="forgotPasswordForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="email">Email Address</label>
              <input name="email" id="email" type="email" class="auth-input" placeholder="Enter your email" required>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="register-btn" style="width: 100%;">Send Link</button>
          </div>

          <div class="form-footer">
            <p>Remembered your password? <a href="/Login" class="auth-link">Back to Login</a></p>
          </div>
        </form>
      </div>
    </section>

    <!-- RIGHT SIDE -->
    <section class="right-panel">
      <img id="ping" src="/Image/stock.jpg" alt="">
    </section>

  </main>
  <script src="/Js/ForgotPassword.js"></script>
</body>

</html>
