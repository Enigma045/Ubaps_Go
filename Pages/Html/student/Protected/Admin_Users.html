    <!-- Main Area -->

      <!-- Header -->
      <header class="header">

          <div class="notification-nav">

      <div class="form-wizard">

        <h1>Create New User</h1>

  <div class="progress-container">

        <!-- FORM -->
        <form id="UserForm">
          <!-- STEP 1 -->
          <section class="step active bursaryForm">
            <div class="form-group">
              <label for="firstName">FirstName</label>
              <input type="text" id="firstName" name="firstName" required placeholder="Richard">
            </div>
            <div class="form-group">
              <label for="lastName">Surname</label>
              <input type="text" id="lastName" name="lastName" required placeholder="Sambo">
            </div>
            <div class="form-group">
              <label for="Email">Email</label>
              <input type="email" id="email" name="Email" required placeholder="CEN-01-14-22@unilia.ac">
            </div>
            <div class="form-group">
              <label for="Phone">Phone Number</label>
              <input type="tel" id="phone" name="phone" required placeholder="0998111960">
            </div>
            <div class="form-group">
              <label for="Password">Password</label>
              <input type="password" id="password" name="password" required placeholder="Enter password">
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm Password</label>
              <input type="password" id="confirmPassword" name="confirmPassword" required
                placeholder="Re-enter password">
            </div>
            <!-- Small option boxes -->
            <!-- <div class="form-group">
              <label>Options</label>
              <div class="option-group">
                <select name="Programs" id="pro">
                    <option value="CEN">CEN</option>
                    <option value="BPH">BPH</option>
                    <option value="EDH">EDH</option>
                    <option value="FSN">FSN</option>
                </select>
                <input type="number" min="0" placeholder="01">
                <input type="number" min="0" placeholder="14">
                <input type="number" min="0" placeholder="22">
              </div>
            </div>

             Programme -->
            <!-- <div class="form-group">
              <label>Programme</label>
              <input type="text" class="auth-input" placeholder="CEN-01-14-22" disabled>
            </div>
     -->
          </section>

          <!-- CONTROLS -->
          <div class="controls">
            <div class="form-group">
              <label>Users</label>
              <div class="radio-group">
                <label>
                  <input class="radio" type="radio" name="Users" value="registrar" required>
                  Registrar
                </label>

                <label>
                  <input class="radio" type="radio" name="Users" value="finance_office">
                  Finance Office
                </label>
                <label>
                  <input class="radio" type="radio" name="Users" value="dean_of_student" required>
                  Dean of Students
                </label>
                <label>
                  <input class="radio" type="radio" name="Users" value="dean_of_science" required>
                  Dean of Applied Science
                </label>
                <label>
                  <input class="radio" type="radio" name="Users" value="dean_of_facult" required>
                  Dean of Faculty
                </label>

                <label>
                  <input class="radio" type="radio" name="Users" value="student" checked>
                  Student
                </label>
              </div>
            </div>
            <button type="submit" id="submit">Submit</button>
          </div>
        </form>

      </div>
