  <!-- FORM -->
  <form id="UserForm">
    <!-- STEP 1 -->
    <section class="step active bursaryForm">
      <div class="form-group">
        <label for="firstName">FirstName</label>
        <input type="text" id="firstName" name="firstName" required placeholder="Richard" value="fancy">
      </div>
      <div class="form-group">
        <label for="lastName">Surname</label>
        <input type="text" id="lastName" name="lastName" required placeholder="Sambo" value="sambo">
      </div>
      <div class="form-group">
        <label for="Email">Email</label>
        <input type="email" id="email" name="Email" required placeholder="CEN-01-14-22@unilia.ac" value="CEN-01-01-22@unilia.ac">
      </div>
      <div class="form-group">
        <label for="Phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required placeholder="0998111960" value="0992341765">
      </div>
      <div class="form-group">
        <label for="Password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter password">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Re-enter password">
      </div>
