<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/Css/Navbar/Navbar.css">
  <link rel="stylesheet" href="/Css/Layout.css">
  <link rel="stylesheet" href="/Css/Notification.css">
  <link rel="stylesheet" href="/Css/Bursary_Scheme.css">
  <link rel="stylesheet" href="/Css/card.css">
  <link rel="stylesheet" href="/Css/Role_Selector.css">
  <link rel="stylesheet" href="/Css/Audit_Trailer.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <title>Audit Log Reports</title>
  <style>
    :root {
      --sr-blue: #0ea5e9;
      --sr-blue-light: #f0f9ff;
      --sr-slate-50: #f8fafc;
      --sr-slate-100: #f1f5f9;
      --sr-slate-200: #e2e8f0;
      --sr-slate-400: #94a3b8;
      --sr-slate-500: #64748b;
      --sr-slate-600: #475569;
      --sr-slate-800: #1e293b;
      --sr-slate-900: #0f172a;
    }

    /* Report Layout Overrides */
    .app {
      padding: 0 !important;
      background: white;
      min-height: calc(100vh - 70px);
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .report-topbar {
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--sr-slate-200);
      background: white;
    }

    .report-title-block h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--sr-slate-900);
      margin: 0 0 4px 0;
      letter-spacing: -0.025em;
    }

    .report-title-block .subtitle {
      font-size: 0.875rem;
      color: var(--sr-slate-500);
      margin: 0;
    }

    .report-selection {
      display: flex;
      gap: 12px;
    }

    .btn-export {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--sr-slate-900);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-export:hover {
      background: #000;
      transform: translateY(-1px);
    }

    /* Analytics Strip */
    .analytics-strip {
      display: flex;
      align-items: center;
      padding: 16px 32px;
      background: var(--sr-slate-50);
      border-bottom: 1px solid var(--sr-slate-200);
      gap: 40px;
    }

    .astat {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .astat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .astat.blue .astat-dot { background: var(--sr-blue); }
    .astat.green .astat-dot { background: #10b981; }
    .astat.red .astat-dot { background: #ef4444; }

    .astat-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--sr-slate-500);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .astat-value {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--sr-slate-900);
    }

    .astat-sep {
      width: 1px;
      height: 24px;
      background: var(--sr-slate-200);
    }

    /* Filter Bar */
    .filter-bar {
      padding: 16px 32px;
      background: white;
      border-bottom: 1px solid var(--sr-slate-200);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-end;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-group label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--sr-slate-500);
      text-transform: uppercase;
      letter-spacing: 0.025em;
    }

    .filter-group input, .filter-group select {
      padding: 8px 12px;
      border: 1px solid var(--sr-slate-200);
      border-radius: 6px;
      font-size: 0.875rem;
      color: var(--sr-slate-900);
      background: white;
      min-width: 140px;
    }

    /* Multi-select styling */
    .multi-select {
      position: relative;
      min-width: 180px;
    }
    .select-box {
      padding: 8px 12px;
      border: 1px solid var(--sr-slate-200);
      border-radius: 6px;
      background: white;
      font-size: 0.875rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .options-list {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid var(--sr-slate-200);
      border-radius: 6px;
      margin-top: 4px;
      z-index: 100;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      padding: 8px;
    }
    .options-list label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      cursor: pointer;
      text-transform: none;
      letter-spacing: normal;
      font-size: 0.85rem;
      color: var(--sr-slate-700);
    }
    .options-list label:hover {
      background: var(--sr-slate-50);
    }
    .options-list.show {
      display: block;
    }

    .btn-apply {
      padding: 9px 20px;
      background: var(--sr-blue);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-apply:hover {
      background: #0ea5e9;
    }

    /* Table container */
    .report-content {
      padding: 32px;
      flex-grow: 1;
      background: white;
    }

    .table-container {
      border: 1px solid var(--sr-slate-200);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .log-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .log-table thead {
      background: var(--sr-slate-900);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .log-table th {
      padding: 12px 16px;
      font-size: 0.65rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--sr-slate-800);
    }

    .log-table td {
      padding: 14px 16px;
      font-size: 0.875rem;
      color: var(--sr-slate-600);
      border-bottom: 1px solid var(--sr-slate-100);
    }

    .log-table tr:hover {
      background: var(--sr-slate-50);
      cursor: pointer;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      padding: 20px 24px;
      background: var(--sr-slate-900);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      padding: 24px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--sr-slate-100);
    }

    .detail-label {
      font-weight: 600;
      color: var(--sr-slate-500);
      font-size: 0.875rem;
    }

    .detail-value {
      font-weight: 600;
      color: var(--sr-slate-900);
      font-size: 0.875rem;
    }

    .status-pill {
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .status-pill.SUCCESS { background: #dcfce7; color: #166534; }
    .status-pill.FAILED { background: #fee2e2; color: #991b1b; }

    .pagination {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .pagination button {
      padding: 8px 14px;
      border: 1px solid var(--sr-slate-200);
      background: white;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--sr-slate-600);
      cursor: pointer;
    }

    .pagination button.active {
      background: var(--sr-blue);
      color: white;
      border-color: var(--sr-blue);
    }
  </style>
</head>

<body>
  <div class="page">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="logo">
        <span class="icon"><img src="/Image/logo-icon.png" alt="Logo"></span>
        <span class="label">UNILIA</span>
      </div>

      <div class="nav-item">
        <span class="icon"><img class="svg" src="/Image/svgviewer-output (3).svg" alt=""></span>
        <span class="label"><a href="/admindashboard" class="text-link">Home</a></span>
      </div>

      <div class="nav-item">
        <span class="icon"><img class="svg" src="/Image/svgviewer-output (11).svg" alt=""></span>
        <span class="label"><a href="/adminusers" class="text-link">Create Users</a></span>
      </div>

      <div class="nav-item">
        <span class="icon"><img class="svg" src="/Image/svgviewer-output (8).svg" alt=""></span>
        <span class="label"><a href="/adminmodification" class="text-link">Users</a></span>
      </div>

      <div class="nav-item">
        <span class="icon"><img class="svg" src="/Image/svgviewer-output (10).svg" alt=""></span>
        <span class="label"><a href="/admintrails" class="text-link">Audit Trail</a></span>
      </div>

      <div class="nav-item active">
        <span class="icon"><img class="svg" src="/Image/svgviewer-output (12).svg" alt=""></span>
        <span class="label"><a href="/audit_reports" class="text-link">Reports</a></span>
      </div>

      <!-- Logout -->
      <div class="nav-item logout">
        <span class="icon"><img class="LogOut" src="/Image/svgviewer-output (7).svg" alt=""></span>
        <span class="label"><a href="/logout" class="text-link" style="color: inherit;">Logout</a></span>
      </div>
    </nav>

    <!-- Main Area -->
    <div class="main">
      <!-- Header -->
      <header class="header">
        <div class="breadcrumb">
          <strong>UBAPS</strong> &gt; Audit Reports
        </div>
        <div class="header-actions">
          <div class="notification-nav">
            <img class="svg" src="/Image/svgviewer-output (5).svg" alt="">
            <span id="badge-nav" class="badge-nav">0</span>
          </div>
          <div id="user-avatar" class="user-avatar">AD</div>
        </div>
      </header>

      <div class="app">
        <!-- Report Top Bar -->
        <div class="report-topbar">
          <div class="report-title-block">
            <h1>Audit Log Reports</h1>
            <p class="subtitle" id="current-report-subtitle">System-wide activity audit trail</p>
          </div>
          <div class="report-selection">
            <button id="export-pdf-btn" class="btn-export">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              Generate PDF
            </button>
          </div>
        </div>

        <!-- Analytics Strip -->
        <div class="analytics-strip">
          <div class="astat blue">
            <span class="astat-dot"></span>
            <span class="astat-label">Total Logs</span>
            <span class="astat-value" id="stat-total">—</span>
          </div>
          <div class="astat-sep"></div>
          <div class="astat green">
            <span class="astat-dot"></span>
            <span class="astat-label">Success Rate</span>
            <span class="astat-value" id="stat-success-rate">—%</span>
          </div>
          <div class="astat-sep"></div>
          <div class="astat red">
            <span class="astat-dot"></span>
            <span class="astat-label">Critical Failures</span>
            <span class="astat-value" id="stat-failures">—</span>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
          <div class="filter-group">
            <label>Categories</label>
            <div class="multi-select" id="logTypeContainer">
              <div class="select-box" id="selectBox">
                <span id="selectedCountText">All Categories</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </div>
              <div class="options-list" id="optionsList">
                <label><input type="checkbox" class="type-checkbox" value="applications" checked> Applications</label>
                <label><input type="checkbox" class="type-checkbox" value="payments" checked> Payments</label>
                <label><input type="checkbox" class="type-checkbox" value="users" checked> System/Users</label>
              </div>
            </div>
          </div>
          <div class="filter-group">
            <label for="userId">Performer ID</label>
            <input type="text" id="userId" placeholder="Admin User ID">
          </div>
          <div class="filter-group">
            <label for="startDate">Start Date</label>
            <input type="date" id="startDate">
          </div>
          <div class="filter-group">
            <label for="endDate">End Date</label>
            <input type="date" id="endDate">
          </div>
          <button id="apply-filters" class="btn-apply">Apply Filters</button>
        </div>

        <!-- Main Content -->
        <div class="report-content">
          <div class="table-container">
            <table class="log-table active" id="reports-table">
              <thead id="table-head">
                <!-- Dynamically populated -->
              </thead>
              <tbody id="table-body">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="pagination" id="pagination-controls">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>

      <!-- Detail Modal -->
      <div id="log-detail-modal" class="modal">
        <div class="modal-content">
          <div class="modal-header">
            <h3 id="modal-title">Log Details</h3>
            <span class="close-modal" id="close-modal" style="cursor:pointer; font-size: 1.5rem;">&times;</span>
          </div>
          <div class="modal-body" id="modal-details-body">
            <!-- Populated via JS -->
          </div>
        </div>
      </div>

      <script src="/Js/Dashboard.js"></script>
      <script src="/Js/Profile_Loader.js"></script>
      <script src="/Js/Audit_Logs_Report.js"></script>
      <script src="/Js/Notification_Feature.js"></script>
    </div>
  </div>
</body>

</html>
