<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/Css/Navbar/Navbar.css">
  <link rel="stylesheet" href="/Css/Layout.css">
  <link rel="stylesheet" href="/Css/Dashboard.css">
  <link rel="stylesheet" href="/Css/Notification.css">
  <script src="/Js/Toast.js"></script>
  <link rel="stylesheet" href="/Css/Audit_Trailer.css">
  <link rel="stylesheet" href="/Css/Bursary_Scheme.css" />
  <title>Audit Logs Reports</title>
  <style>
    .filter-section {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      align-items: flex-end;
      background: var(--surface-color);
      padding: 1rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .filter-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .filter-group input {
      padding: 0.5rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
    }
    .actions-btn-group {
      margin-left: auto;
      display: flex;
      gap: 0.5rem;
    }
    .export-btn {
      background-color: var(--success-color);
    }
    .export-btn:hover {
      background-color: #059669;
    }
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      padding: 1rem;
    }
    .pagination button {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-color);
      background: var(--surface-color);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
    }
    .pagination button:hover:not(:disabled) {
      background: var(--background-color);
      border-color: var(--primary-color);
    }
    .pagination button.active {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }
    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--surface-color);
      padding: 0;
      border-radius: var(--radius-lg);
      width: 500px;
      max-width: 90%;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: modalSlideUp 0.3s ease-out;
    }

    @keyframes modalSlideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      padding: 1.5rem;
      background: var(--primary-color);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 1.25rem;
    }

    .close-modal {
      font-size: 1.5rem;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .close-modal:hover {
      opacity: 1;
    }

    .modal-body {
      padding: 1.5rem;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border-color);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    .detail-value {
      font-weight: 500;
      color: var(--text-primary);
      text-align: right;
    }

    .status-pill {
      padding: 0.25rem 0.75rem;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-pill.SUCCESS { background: #dcfce7; color: #166534; }
    .status-pill.FAILED { background: #fee2e2; color: #991b1b; }

    /* Specialized Card Enhancements */
    .detail-row.highlight {
      background: #f1f5f9;
      margin: -1.5rem -1.5rem 1rem -1.5rem;
      padding: 1.5rem;
      border-bottom: 2px solid var(--primary-color);
    }

    .detail-row.highlight .detail-value {
      font-size: 1.25rem;
      color: var(--primary-color);
      font-weight: 800;
    }

    .detail-row.highlight-amount {
      background: #ecfdf5;
      margin: -1.5rem -1.5rem 1rem -1.5rem;
      padding: 1.5rem;
      border-bottom: 2px solid var(--success-color);
    }

    .detail-row.highlight-amount .detail-value {
      font-size: 1.5rem;
      color: #059669;
      font-weight: 900;
    }

    .detail-row.separator {
      height: 1px;
      background: var(--border-color);
      margin: 1rem 0;
      padding: 0;
    }

    tr { cursor: pointer; transition: background 0.2s; }
    tr:hover { background-color: var(--background-color) !important; }
  </style>
</head>

<body>
  <div class="page">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="logo">
        <span class="icon"><img src="/Image/logo-icon.png" alt="Logo"></span>
        <span class="label">UNILIA</span>
      </div>

      <div class="nav-item">
        <span class="icon"><img class="svg" src="/Image/svgviewer-output (3).svg" alt=""></span>
        <span class="label"><a href="/admindashboard" class="text-link">Home</a></span>
      </div>

      <div class="nav-item">
        <span class="icon"><img class="svg" src="/Image/svgviewer-output (11).svg" alt=""></span>
        <span class="label"><a href="/adminusers" class="text-link">Create Users</a></span>
      </div>

      <div class="nav-item">
        <span class="icon"><img class="svg" src="/Image/svgviewer-output (8).svg" alt=""></span>
        <span class="label"><a href="/adminmodification" class="text-link">Users</a></span>
      </div>

      <div class="nav-item">
        <span class="icon"><img class="svg" src="/Image/svgviewer-output (10).svg" alt=""></span>
        <span class="label"><a href="/admintrails" class="text-link">Audit Trail</a></span>
      </div>

      <div class="nav-item active">
        <span class="icon"><img class="svg" src="/Image/svgviewer-output (12).svg" alt=""></span>
        <span class="label"><a href="/audit_reports" class="text-link">Reports</a></span>
      </div>

      <!-- Logout -->
      <div class="nav-item logout">
        <span class="icon"><img class="LogOut" src="/Image/svgviewer-output (7).svg" alt=""></span>
        <span class="label"><a href="/logout" class="text-link" style="color: inherit;">Logout</a></span>
      </div>
    </nav>
    <!-- Main Area -->
    <div class="main">

      <!-- Header -->
      <header class="header">
        <div class="breadcrumb">
          <strong>UBAPS</strong> &gt; Audit Reports
        </div>
        <div class="header-actions">
          <div class="notification-nav">
            <img class="svg" src="/Image/svgviewer-output (5).svg" alt="">
            <span id="badge-nav" class="badge-nav">0</span>
          </div>
          <div id="user-avatar" class="user-avatar">
            RS
          </div>
        </div>
      </header>

      <div class="app">

        <!-- Header -->
        <header class="head">
          <div>
            <h1>Audit Log Reports</h1>
            <p class="subtitle">Bursary Award Processing System · Production</p>
          </div>
          <div class="time" id="current-time">
            Jan 6, 2026 · 01:34 AM
          </div>
        </header>

        <!-- Filters -->
        <div class="filter-section">
          <div class="filter-group">
            <label for="startDate">Start Date</label>
            <input type="date" id="startDate">
          </div>
          <div class="filter-group">
            <label for="endDate">End Date</label>
            <input type="date" id="endDate">
          </div>
          <div class="filter-group">
            <label for="logType">Log Type</label>
            <select id="logType" style="padding: 0.5rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
                <option value="applications">Applications</option>
                <option value="payments">Payments</option>
                <option value="users">Users</option>
            </select>
          </div>
          <div class="actions-btn-group">
            <button class="btn" id="apply-filters">Apply Filter</button>
            <button class="btn export-btn" id="export-report">Export Report</button>
          </div>
        </div>

        <!-- Logs Table -->
        <div class="table-container">
          <table class="log-table active" id="reports-table">
            <thead id="table-head">
              <!-- Dynamically populated -->
            </thead>
            <tbody id="table-body">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination-controls">
            <!-- Dynamically populated -->
        </div>

      </div>

      <!-- Log Detail Modal -->
      <div id="log-detail-modal" class="modal">
        <div class="modal-content">
          <div class="modal-header" id="modal-header">
            <h3>Audit Log Details</h3>
            <span class="close-modal" id="close-modal">&times;</span>
          </div>
          <div class="modal-body" id="modal-details-body">
            <!-- Populated via JS -->
          </div>
        </div>
      </div>

      <script src="/Js/Dashboard.js"></script>
      <script src="/Js/Profile_Loader.js"></script>
      <script src="/Js/Audit_Logs_Report.js"></script>
      <script src="/Js/Notification_Feature.js"></script>
    </div>
</body>

</html>
