<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Css/Navbar/Navbar.css">
    <link rel="stylesheet" href="/Css/Layout.css">
    <link rel="stylesheet" href="/Css/Notification.css">
    <link rel="stylesheet" href="/Css/Letters_receive.css">
    <link rel="stylesheet" href="/Css/Student_reports.css">
    <title>Letters Received</title>
</head>

<body>
    <div class="page">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="logo">
                <span class="icon"><img src="/Image/logo-icon.png" alt="Logo"></span>
                <span class="label">UNILIA</span>
            </div>

            <div class="nav-item">
                <span class="icon"><img class="svg" src="/Image/svgviewer-output (3).svg" alt=""></span>
                <span class="label"><a href="/registrardashboard" class="text-link">Home</a></span>
            </div>

            <div class="nav-item">
                <span class="icon"><img class="svg" src="/Image/svgviewer-output (4).svg" alt=""></span>
                <span class="label"><a href="/scheme" class="text-link">Bursary Scheme</a></span>
            </div>

            <div class="nav-item">
                <span class="icon"><img class="svg" src="/Image/svgviewer-output (13).svg" alt=""></span>
                <span class="label"><a href="/decision" class="text-link">Judge</a></span>
            </div>

            <div class="nav-item active">
                <span class="icon"><img class="svg" src="/Image/svgviewer-output (15).svg" alt=""></span>
                <span class="label"><a href="/receive_letters" class="text-link">Letters</a></span>
            </div>

            <div class="nav-item">
                <span class="icon"><img class="svg" src="/Image/svgviewer-output (12).svg" alt=""></span>
                <span class="label"><a href="/general_reports" class="text-link">Reports</a></span>
            </div>

            <!-- Logout -->
            <div class="nav-item logout">
                <span class="icon"><img class="LogOut" src="/Image/svgviewer-output (7).svg" alt=""></span>
                <span class="label"><a href="/logout" class="text-link" style="color: inherit;">Logout</a></span>
            </div>
        </nav>
        <!-- Main Area -->
        <div class="main">

            <!-- Header -->
            <header class="header">
                <div class="breadcrumb">
                    <strong>UBAPS</strong> &gt; Letters Received
                </div>
                <div class="header-actions">
                    <div class="notification-nav">
                        <img class="svg" src="/Image/svgviewer-output (5).svg" alt="">
                        <span id="badge-nav" class="badge-nav">0</span>
                    </div>
                    <div id="user-avatar" class="user-avatar">
                        RS
                    </div>
                </div>
            </header>

            <div class="app">

                <!-- Report Top Bar -->
                <div class="report-topbar">
                    <div class="report-title-block">
                        <h1>Applicant Letters</h1>
                        <p class="subtitle">Bursary Award Processing System · Production</p>
                    </div>
                    <div class="report-selection">
                        <div class="time" style="font-size: 0.75rem; color: var(--sr-slate-500);">
                            Jan 6, 2026 · 01:34 AM
                        </div>
                    </div>
                </div>

                <!-- Filter Bar -->
                <div class="filter-bar">
                  <div class="filter-group" style="flex: 1.5;">
                    <label>Search Letters</label>
                    <input type="text" id="filter-search" placeholder="Name or registration number..." />
                  </div>
                  <div class="filter-group">
                    <label>Department</label>
                    <select id="filter-dept">
                      <option value="">All Departments</option>
                      <option value="CEN">CEN</option>
                      <option value="BPH">BPH</option>
                      <option value="FSN">FSN</option>
                      <option value="EDU">EDU</option>
                    </select>
                  </div>
                  <div class="filter-group">
                    <label>Letter Type</label>
                    <select id="filter-scheme">
                      <option value="">All Types</option>
                      <option value="Bursary Application">Application</option>
                      <option value="Appeal Letter">Appeal</option>
                      <option value="Statement">Statement</option>
                    </select>
                  </div>
                  <button id="clear-filters" class="btn-clear">Clear</button>
                </div>
                <div id="active-filters-container" class="active-filters"></div>

                <!-- Logs Table -->
                <div class="table-container">
                    <table class="log-table active" id="letters">
                        <thead>
                            <tr>
                                <th style="width: 60px;">Status</th>
                                <th>Student Name</th>
                                <th>Reg #</th>
                                <th>Letter Type</th>
                                <th>Date Submitted</th>
                                <th style="width: 150px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data populated by JS, placeholder removed for clean UI -->
                        </tbody>
                    </table>
                </div>

                <div class="pagination" id="pagination-controls">
                  <!-- Dynamically populated -->
                </div>

            </div>
        </div>


    </div>
    <script src="/Js/Dashboard.js"></script>
    <script src="/Js/Profile_Loader.js"></script>
    <script src="/Js/Letters_receive.js"></script>
    <script src="/Js/Notification_Feature.js"></script>
    <script src="/Js/Filter_Feature.js"></script>
</body>

</html>
