<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/Css/Navbar/Navbar.css">
  <link rel="stylesheet" href="/Css/Layout.css">
  <link rel="stylesheet" href="/Css/Dashboard.css">
  <link rel="stylesheet" href="/Css/Notification.css">
  <script src="/Js/Toast.js"></script>
  <title>Admin Dashboard</title>
</head>

<body>

  <div class="page">

    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="logo">
        <span class="icon"><img src="/Image/logo-icon.png" alt="Logo"></span>
        <span class="label">UNILIA</span>
      </div>

      <div class="nav-item active">
        <span class="icon"><img class="svg" src="/Image/svgviewer-output (3).svg" alt=""></span>
        <span class="label"><a href="/admindashboard" class="text-link">Home</a></span>
      </div>

      <div class="nav-item">
        <span class="icon"><img class="svg" src="/Image/svgviewer-output (11).svg" alt=""></span>
        <span class="label"><a href="/adminusers" class="text-link">Create Users</a></span>
      </div>

      <div class="nav-item">
        <span class="icon"><img class="svg" src="/Image/svgviewer-output (8).svg" alt=""></span>
        <span class="label"><a href="/adminmodification" class="text-link">Users</a></span>
      </div>

      <div class="nav-item">
        <span class="icon"><img class="svg" src="/Image/svgviewer-output (10).svg" alt=""></span>
        <span class="label"><a href="/admintrails" class="text-link">Audit Trail</a></span>
      </div>

      <div class="nav-item">
        <span class="icon"><img class="svg" src="/Image/svgviewer-output (12).svg" alt=""></span>
        <span class="label"><a href="/admintrails" class="text-link">Reports</a></span>
      </div>

      <!-- Logout -->
      <div class="nav-item logout">
        <span class="icon"><img class="LogOut" src="/Image/svgviewer-output (7).svg" alt=""></span>
        <span class="label"><a href="/logout" class="text-link" style="color: inherit;">Logout</a></span>
      </div>
    </nav>
    <!-- Main Area -->
    <div class="main">

      <!-- Header -->
      <header class="header">
        <div class="breadcrumb">
          <strong>UBAPS</strong> &gt; Home
        </div>
        <div class="header-actions">
          <div class="notification-nav">
            <img class="svg" src="/Image/svgviewer-output (5).svg" alt="">
            <span id="badge-nav" class="badge-nav">0</span>
          </div>
          <div id="user-avatar" class="user-avatar">
            RS
          </div>
        </div>
      </header>

      <!-- Content -->
      <main class="content">
        <h2 id="welcome-message">Welcome, Admin</h2>

        <div class="apply-row">
          <p>To Create a User click here </p>
          <button class="apply-btn">Create User Page</button>
        </div>

        <!-- Dashboard Cards -->
        <div class="stats-cards">

          <div class="stat-card">

            <div class="stat-info">
              <p class="stat-label">Total Users</p>
              <h2 id="total-users" class="stat-value">0</h2>
            </div>
          </div>

          <div class="stat-card">

            <div class="stat-info">
              <p class="stat-label">Active Users</p>
              <h2 id="active-users" class="stat-value">0</h2>
            </div>
          </div>

          <div class="stat-card">

            <div class="stat-info">
              <p class="stat-label">Deactive Users</p>
              <h2 id="deactive-users" class="stat-value">0</h2>
            </div>
          </div>

          <div class="stat-card">

            <div class="stat-info">
              <p class="stat-label">System Health</p>
              <h2 class="stat-value">Good</h2>
            </div>
          </div>

        </div>


        <!-- Quick Links -->
        <div class="quick-links">
          <div class="card-grid">

            <div class="action-card" onclick="location.href = '/adminusers'">
              <div class="card-icon"><img class="svg" src="/Image/svgviewer-output (11).svg" alt=""></div>
              <h3>Create Users</h3>
              <p>Navigate to Create users Page</p>
            </div>

            <div class="action-card" onclick="location.href = '/adminmodification'">
              <div class="card-icon"><img class="svg" src="/Image/svgviewer-output (8).svg" alt=""></div>
              <h3>Users</h3>
              <p>See the list of users</p>
            </div>

            <div class="action-card" onclick="location.href = '/adminusers'">
              <div class="card-icon"><img class="svg" src="/Image/svgviewer-output (12).svg" alt=""></div>
              <h3>Reports</h3>
              <p>Access your reports</p>
            </div>

          </div>

        </div>

        <script src="/Js/Dashboard.js"></script>
        <script src="/Js/Profile_Loader.js"></script>
        <script src="/Js/Admin_Dashboard.js"></script>
        <script src="/Js/Role_Selector.js"></script>
        <script src="/Js/Notification_Feature.js"></script>
</body>

</html>
